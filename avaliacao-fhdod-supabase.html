<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avaliação do atendimento | Fundação Hospitalar Dr. Oswaldo Diesel</title>
<meta name="description" content="Avalie o atendimento que você recebeu no Hospital Dr. Oswaldo Diesel, em Três Coroas - RS. Rápido e anônimo.">
<style>
:root{--bg:#F6F6F7;--card:#fff;--ink:#20232A;--mut:#5A6270;--pri:#D71E26;--pri2:#FBE6E6;--line:#DADDE2;--sb:#FDF0F0;--sbr:#F2CFCF;--on:#fff;--warn:#8A3B0B;--sh:0 2px 8px rgba(32,35,42,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191E;--card:#22252C;--ink:#F1F3F5;--mut:#B3B9C3;--pri:#FF7A7A;--pri2:#3A2225;--line:#3A3F49;--on:#17191E;--warn:#F2B27E;--sh:none;--sb:#2B2124;--sbr:#4A2F33}}
:root[data-theme="dark"]{--sb:#2B2124;--sbr:#4A2F33;--bg:#17191E;--card:#22252C;--ink:#F1F3F5;--mut:#B3B9C3;--pri:#FF7A7A;--pri2:#3A2225;--line:#3A3F49;--on:#17191E;--warn:#F2B27E;--sh:none}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.hd{background:#fff;border-bottom:4px solid #D71E26}
.hd div{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd img{height:52px;width:auto;display:block}
.hd a{color:#D71E26;text-decoration:none;text-align:right;font-size:.75rem;line-height:1.1;color:#5A6270}
.hd a b{display:block;color:#D71E26;font-size:1.05rem;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:22px 16px 28px;outline:0}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 8px}
h2{font-size:1.35rem;line-height:1.3;margin:6px 0 18px}
p{margin:0 0 12px}
.mut{color:var(--mut);font-size:.95rem}
button{transition:transform .08s,border-color .15s,background .15s;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.in{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none}}
.hero{background:var(--card);border-radius:14px;padding:20px 18px;box-shadow:var(--sh);border:1px solid var(--line);border-left:6px solid #D71E26}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.sec{background:var(--sb);border:1px solid var(--sbr);border-radius:12px;color:var(--ink);text-align:left;min-height:96px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;font-weight:600;line-height:1.25}
.sec i{font-style:normal;font-size:1.35rem;width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--sbr);display:grid;place-items:center}
.sec:hover,.sec:active{border-color:var(--pri)}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:8px 0 6px}
.seg i{height:7px;border-radius:7px;background:var(--line)}
.seg i.on{background:#D71E26}
.step{font-size:.9rem;color:var(--mut);display:flex;justify-content:space-between}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;min-height:58px;text-align:left;font-weight:600;font-size:1.02rem;display:flex;align-items:center;gap:14px;box-shadow:var(--sh)}.opt:hover{border-color:var(--pri)}
.opt::before{content:"";flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--mut)}
.opt[aria-pressed=true],.opt:active{border-color:var(--pri);background:var(--pri2)}
.opt[aria-pressed=true]::before{border-color:var(--pri);background:radial-gradient(var(--pri) 45%,transparent 50%)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:11px 18px;min-height:48px;box-shadow:var(--sh)}.chip:hover{border-color:var(--pri)}
.chip[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--on);font-weight:600}
.chip[aria-pressed=true]::before{content:"✓ "}
.nps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 6px}
.nps button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:.95rem;box-shadow:var(--sh)}
.nps svg{width:78%;max-width:44px;height:auto}
.nps button[aria-pressed=true]{border-color:var(--ink);background:var(--pri2);transform:scale(1.08)}
.grp{border:0;padding:0;margin:0 0 18px}.grp legend{font-weight:600;margin-bottom:8px;padding:0}.pick{display:grid;gap:8px}.pick.c2{grid-template-columns:1fr 1fr}.pick.c3{grid-template-columns:1fr 1fr 1fr}.pk{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 6px;min-height:54px;font-weight:600;text-align:center;line-height:1.2}.pk:hover{border-color:var(--pri)}.pk[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--on)}input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px}.ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut);margin-top:12px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:24px;min-height:56px;background:var(--pri);color:var(--on);border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:1.08rem;box-shadow:0 4px 12px rgba(215,30,38,.28)}.cta::after{content:"→";font-size:1.2em}.cta:hover{filter:brightness(.93)}
.cta:disabled{background:var(--line);color:var(--mut);box-shadow:none;cursor:not-allowed}
.ghost{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:6px 16px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--ink);font-size:.92rem;font-weight:600}.ghost:hover{border-color:var(--pri)}.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:.88rem;padding:10px 0;min-height:44px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl-wrap{overflow-x:auto}
.note{border-left:4px solid var(--warn);padding:8px 12px;background:var(--card);font-size:.9rem;margin:12px 0}
.fld{margin-bottom:14px}.fld label{display:block;font-weight:600;margin-bottom:6px}.fld input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 12px;min-height:50px}.err{color:var(--pri);font-weight:600;min-height:1.4em;margin:0 0 6px}.sh{display:flex;align-items:center;gap:8px;font-size:.92rem;margin-bottom:6px}.sh input{width:20px;height:20px}.ok{display:grid;place-items:center;margin:8px 0 14px}
footer{max-width:640px;margin:0 auto;padding:0 16px 32px;font-size:.88rem;color:var(--mut)}
button:active:not(:disabled){transform:scale(.98)}.ouv{background:var(--card);border:1px solid var(--line);border-left:6px solid #D71E26;border-radius:14px;padding:16px;box-shadow:var(--sh)}.ouv h2{font-size:1.15rem;margin:0 0 4px}.ouv p{margin:0;color:var(--mut);font-size:.95rem}.ob{display:grid;gap:10px;margin-top:14px}@media(min-width:520px){.ob{grid-template-columns:1fr 1fr}}.lk{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:10px 12px;border:2px solid var(--pri);border-radius:12px;background:var(--card);color:var(--pri);font-weight:700;text-decoration:none;overflow-wrap:anywhere;text-align:center}.lk:hover{background:var(--pri2)}.lk svg{flex:none}
</style>
</head>

var app=document.getElementById("app"),cur=null,st=0,ans={};

return '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="hsl('+hue+',78%,56%)" stroke="#20232A" stroke-width="1.6"/><circle cx="14" cy="16" r="2.2" fill="#20232A"/><circle cx="26" cy="16" r="2.2" fill="#20232A"/><path d="M12 27Q20 '+my.toFixed(1)+' 28 27" fill="none" stroke="#20232A" stroke-width="2.2" stroke-linecap="round"/></svg>';
}
function home(){
cur=null;st=0;ans={};
draw('<div class="hero"><h1>Como foi o seu atendimento?</h1><p class="mut" style="margin:0">Sua opinião ajuda o hospital a melhorar. São 5 perguntas rápidas, leva cerca de 1 minuto. Escolha o setor onde você foi atendido(a):</p></div><div class="grid">'+S.map(function(s){return '<button class="sec" data-s="'+s[0]+'"><i aria-hidden="true">'+s[2]+'</i>'+s[1]+'</button>'}).join("")+'</div>');
app.querySelectorAll(".sec").forEach(function(b){b.onclick=function(){cur=S.filter(function(s){return s[0]===b.dataset.s})[0];st=0;ans={a:[],pos:[],neg:[]};render()}});
}
function hdr(){
var seg="";for(var i=0;i<6;i++)seg+='<i class="'+(i<=st?"on":"")+'"></i>';
return '<button class="ghost" id="back">← '+(st?"Voltar":"Trocar de setor")+'</button><div class="step"><span>'+cur[1]+'</span><span>'+(st<5?'Pergunta '+(st+1)+' de 5':'Último passo')+'</span></div><div class="seg" role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="'+(st+1)+'">'+seg+'</div>';
}
function bind(){document.getElementById("back").onclick=function(){if(st){st--;render()}else home()}}
function render(){
if(st<2){
var q=cur[3+st],order=[4,3,2,1,0];
draw(hdr()+'<h2>'+q+'</h2><div class="opts">'+order.map(function(i){return '<button class="opt" data-v="'+(i+1)+'" aria-pressed="'+(ans.a[st]===i+1)+'">'+LAB[i]+'</button>'}).join("")+'</div>');
app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){ans.a[st]=+b.dataset.v;st++;render()}});
}else if(st<4){
var pos=st===2,key=pos?"pos":"neg",list=(pos?POS:NEG).slice();
if(pos&&cur[0]==="ic")list.push("Alimentação");
draw(hdr()+'<h2>'+(pos?"O que foi bom no atendimento?":"O que pode melhorar?")+'</h2><p class="mut">Toque em quantos quiser. Você pode pular.</p><div class="chips">'+list.map(function(c){return '<button class="chip" aria-pressed="'+(ans[key].indexOf(c)>=0)+'">'+c+'</button>'}).join("")+'</div><button class="cta" id="next">Continuar</button>');
app.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){
var t=b.textContent.replace("✓ ",""),a=ans[key],i=a.indexOf(t);
if(i<0){if(t==="Nada a melhorar")a.length=0;else{var n=a.indexOf("Nada a melhorar");if(n>=0)a.splice(n,1)}a.push(t)}else a.splice(i,1);
render()}});
document.getElementById("next").onclick=function(){st++;render()};
}else{
if(st===4){
var btns="";for(var n=1;n<=10;n++)btns+='<button data-n="'+n+'" aria-label="Nota '+n+'" aria-pressed="'+(ans.n===n)+'">'+face((n-1)/9)+n+'</button>';
draw(hdr()+'<h2>De 1 a 10, qual a chance de você recomendar o hospital a um amigo ou familiar?</h2><div class="nps">'+btns+'</div><div class="ends"><span>1 = nada provável</span><span>10 = extremamente provável</span></div><button class="cta" id="go"'+(ans.n==null?" disabled":"")+'>Continuar</button>');
app.querySelectorAll(".nps button").forEach(function(b){b.onclick=function(){ans.n=+b.dataset.n;render()}});
document.getElementById("go").onclick=function(){st=5;render()};
}else{
var td=new Date(),iso=td.getFullYear()+"-"+("0"+(td.getMonth()+1)).slice(-2)+"-"+("0"+td.getDate()).slice(-2);
function grp(k,leg,opts,c){return '<fieldset class="grp"><legend>'+leg+'</legend><div class="pick '+c+'">'+opts.map(function(o){return '<button type="button" class="pk" data-k="'+k+'" data-v="'+o+'" aria-pressed="'+(ans[k]===o)+'">'+o+'</button>'}).join("")+'</div></fieldset>'}
draw(hdr()+'<h2>Só mais alguns detalhes</h2><div class="grp"><label for="dt" style="display:block;font-weight:600;margin-bottom:8px">Em que dia você foi atendido(a)?</label><input type="date" id="dt" max="'+iso+'" value="'+(ans.d||"")+'"></div>'+grp("tu","Em qual turno?",["Dia","Noite"],"c2")+grp("re","Você é:",["Paciente","Familiar"],"c2")+grp("ti","Tipo de atendimento:",["SUS","Plano de Saúde","Particular"],"c3")+'<p class="err" id="se" role="alert"></p><button class="cta" id="send">Enviar avaliação</button>');

chk();
sd.onclick=function(){sd.disabled=true;sd.textContent="Enviando...";document.getElementById("se").textContent="";sv({setor:cur[0],nota1:ans.a[0],nota2:ans.a[1],positivos:ans.pos,negativos:ans.neg,nps:ans.n,data_atendimento:ans.d,turno:ans.tu,respondente:ans.re,tipo_atendimento:ans.ti}).then(function(r){if(r.error){document.getElementById("se").textContent=sb?"Não foi possível enviar agora. Tente novamente.":CFG;sd.textContent="Enviar avaliação";chk()}else fin()})};
}
}
bind();
}
function fin(){
draw('<div class="hero" style="text-align:center"><div class="ok"><svg width="72" height="72" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#D71E26"/><path d="M11 21l6 6 12-13" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1>Obrigado pela sua opinião!</h1><p>Ela ajuda o hospital a melhorar o atendimento.</p><p class="mut" style="margin:0">Se quiser retorno do hospital, fale com a Ouvidoria logo abaixo.</p></div><button class="cta" id="again">Avaliar outro setor</button>');
document.getElementById("again").onclick=home;
}
function topN(arr,k){var c={};arr.forEach(function(r){r[k].forEach(function(x){c[x]=(c[x]||0)+1})});var e=Object.keys(c).sort(function(a,b){return c[b]-c[a]}).slice(0,2).map(function(x){return x+" ("+c[x]+")"});return e.length?e.join(", "):"-"}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fld(id,l,t,x){return '<div class="fld"><label for="'+id+'">'+l+'</label><input id="'+id+'" name="'+id+'" type="'+t+'" '+(x||"")+'></div>'}
function showPw(ids){var c=document.getElementById("sp");c.onchange=function(){ids.forEach(function(i){document.getElementById(i).type=c.checked?"text":"password"})}}
function gate(){if(!sb){draw('<button class="ghost" id="hm">← Início</button><div class="note">'+CFG+'</div>');document.getElementById("hm").onclick=home;return}dash()}
function dash(){
if(!sb)return gate();
sb.auth.getSession().then(function(r){
var ses=r.data&&r.data.session;if(!ses)return loginView();
var nome=(ses.user.user_metadata&&ses.user.user_metadata.nome)||ses.user.email;
draw('<p class="mut">Carregando resultados…</p>');
sb.from("avaliacoes").select("setor,nota1,nota2,positivos,negativos,nps").order("criado_em",{ascending:false}).limit(5000).then(function(q){
var d=(q.data||[]).map(function(x){return{s:x.setor,a:[x.nota1,x.nota2],pos:x.positivos||[],neg:x.negativos||[],n:x.nps}});
var rows=S.map(function(s){
var r=d.filter(function(x){return x.s===s[0]});
if(!r.length)return '<tr><td>'+s[1]+'</td><td colspan="4">Sem respostas</td></tr>';
var avg=(r.reduce(function(t,x){return t+(x.a[0]+x.a[1])/2},0)/r.length).toFixed(1);
var nps=Math.round(100*(r.filter(function(x){return x.n>=9}).length-r.filter(function(x){return x.n<=6}).length)/r.length);
var neg=r.filter(function(x){return x.neg.indexOf("Nada a melhorar")<0});
return '<tr><td>'+s[1]+'</td><td>'+r.length+'</td><td>'+avg+'/5</td><td>'+nps+'</td><td>Bom: '+topN(r,"pos")+'<br>Melhorar: '+topN(neg,"neg")+'</td></tr>';
}).join("");
draw('<button class="ghost" id="hm">← Início</button> <button class="ghost" id="out">Sair</button><h1>Painel da equipe</h1><p class="mut" style="margin-bottom:6px">Olá, '+esc(nome)+'.</p><p class="mut">Resumo por setor: respostas, nota média (1 a 5), NPS (de -100 a 100) e o que mais apareceu.</p>'+((q.error||!d.length)?'<div class="note">'+(q.error?"Não foi possível carregar os dados agora.":"Nenhuma resposta visível. Se já existem avaliações, seu e-mail ainda não foi autorizado pela coordenação do hospital.")+'</div>':'')+'<div class="box tbl-wrap"><table class="tbl"><thead><tr><th>Setor</th><th>Resp.</th><th>Nota</th><th>NPS</th><th>Destaques</th></tr></thead><tbody>'+rows+'</tbody></table></div>');
document.getElementById("hm").onclick=home;
document.getElementById("out").onclick=function(){sb.auth.signOut().then(home)};
});
});
}
function loginView(){
draw('<button class="ghost" id="hm">← Início</button><h1>Área da equipe</h1><p class="mut">Entre com sua conta de funcionário para ver os resultados.</p><form id="f" novalidate>'+fld("em","E-mail","email",'autocomplete="username" required')+fld("pw","Senha","password",'autocomplete="current-password" required')+'<label class="sh"><input type="checkbox" id="sp"> Mostrar senha</label><p class="err" id="er" role="alert"></p><button class="cta" type="submit">Entrar</button></form><p class="mut" style="margin:16px 0 0;text-align:center">Não tem acesso? Peça à coordenação do hospital.</p>');
document.getElementById("hm").onclick=home;showPw(["pw"]);
var er=document.getElementById("er");
document.getElementById("f").onsubmit=function(e){
e.preventDefault();
var em=document.getElementById("em").value.trim().toLowerCase(),pw=document.getElementById("pw").value;
if(!em||!pw){er.textContent="Preencha e-mail e senha.";return}
er.textContent="Entrando...";
sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){if(r.error)er.textContent="E-mail ou senha incorretos, ou o e-mail ainda não foi confirmado.";else dash()});
};
}
document.getElementById("staff").onclick=gate;
home();
</script>
</body>
</html>
