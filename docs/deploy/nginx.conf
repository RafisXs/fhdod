# Modelo: substituir domínio e caminhos do certificado antes de instalar.
server {
    listen 80;
    server_name avaliacao.hospital.example;
    return 301 https://avaliacao.hospital.example$request_uri;
}
server {
    listen 443 ssl;
    server_name avaliacao.hospital.example;
    ssl_certificate /etc/letsencrypt/live/avaliacao.hospital.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avaliacao.hospital.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Um único proxy confiável: substituir cabeçalhos enviados pelo cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
